name: stats
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats-collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: collect
        run: python3 scripts/collect.py
      - name: commit
        run: |
          git config user.name "tgcf-stats"
          git config user.email "stats@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "stats: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push