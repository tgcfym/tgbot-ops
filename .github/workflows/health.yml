name: health
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: health
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe /health
        id: probe
        run: |
          set -uo pipefail
          code=$(curl -sS -o h.json -w '%{http_code}' --max-time 25 https://tgcfym.us.ci/health || true)
          bad=""
          [ "$code" = "200" ] || bad="http=$code;"
          jq -e '.ok==true' h.json >/dev/null 2>&1 || bad="${bad}ok!=true;"
          jq -e '[.bindings[]]|all' h.json >/dev/null 2>&1 || bad="${bad}binding-down;"
          head -c 300 h.json; echo
          echo "bad=$bad" >> "$GITHUB_OUTPUT"
      - name: alert
        if: steps.probe.outputs.bad != ''
        uses: actions/github-script@v7
        env:
          BAD: ${{ steps.probe.outputs.bad }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const body = `探测失败：${process.env.BAD}\n\n日志：${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const o = await github.rest.issues.listForRepo({owner, repo, state: 'open', labels: 'health'});
            if (o.data.length) await github.rest.issues.createComment({owner, repo, issue_number: o.data[0].number, body});
            else await github.rest.issues.create({owner, repo, title: 'tgcfym.us.ci 健康探测失败', body, labels: ['health']});
      - name: recover
        if: steps.probe.outputs.bad == ''
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const o = await github.rest.issues.listForRepo({owner, repo, state: 'open', labels: 'health'});
            for (const i of o.data) {
              await github.rest.issues.createComment({owner, repo, issue_number: i.number, body: '已自动恢复 ✅'});
              await github.rest.issues.update({owner, repo, issue_number: i.number, state: 'closed'});
            }
      - name: keepalive
        if: github.event.schedule == '0 3 1 * *'
        run: |
          mkdir -p status && date -u +%FT%TZ > status/last-alive.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -m 'chore: 月度保活（防 60 天自动停用定时工作流）' && git push
